project:
  type: website
  output-dir: _site
  # Compiled TypeScript the notebooks import from OJS cells. Built outside Quarto
  # (npm run render / npm run dev): a pre-render hook would rewrite js/ on every
  # preview render, which reloads the preview back to the home page.
  resources:
    - /js/*.js

website:
  title: "Surveying Engineering Technology"
  site-url: https://gavincabbage.github.io/svt/
  repo-url: https://github.com/gavincabbage/svt
  navbar:
    left:
      - href: index.qmd
        text: Notebooks
